      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      optimusdb-network:
        ipv4_address: 172.28.1.80
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.optimusdb.service=tinyllama"
      - "com.optimusdb.agent=8"
      - "com.optimusdb.role=follower"

  optimusdb-agent-8:
    image: optimusdb/agent:latest
    container_name: optimusdb-agent-8
    hostname: optimusdb-agent-8
    restart: unless-stopped
    depends_on:
      tinyllama-agent-8:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    ports:
      - "9098:9091"
      - "8088:8081"
    environment:
      - AGENT_ID=8
      - AGENT_PORT=9091
      - CREDENTIALS_PORT=8081
      - IPFS_API=/ip4/127.0.0.1/tcp/5001
      - ORBITDB_DIRECTORY=/data/orbitdb
      - SQLITE_PATH=/data/optimusdb.db
      - BOOTSTRAP_PEERS=/ip4/172.28.1.11/tcp/9091,/ip4/172.28.1.21/tcp/9091,/ip4/172.28.1.31/tcp/9091,/ip4/172.28.1.41/tcp/9091,/ip4/172.28.1.51/tcp/9091,/ip4/172.28.1.61/tcp/9091,/ip4/172.28.1.71/tcp/9091
      - ELECTION_ENABLED=true
      - ELECTION_HEARTBEAT_INTERVAL=5s
      - ELECTION_LEASE_DURATION=15s
      - ELECTION_VOTE_TIMEOUT=10s
      - TINYLLAMA_ENDPOINT=http://tinyllama-agent-8:8080/v1/completions
      - TINYLLAMA_ENABLED=true
      - TINYLLAMA_TIMEOUT=30s
      - TINYLLAMA_MAX_TOKENS=512
      - TINYLLAMA_TEMPERATURE=0.7
      - LOG_LEVEL=info
      - RUST_LOG=info
    volumes:
      - agent8-data:/data
      - agent8-orbitdb:/data/orbitdb
    networks:
      optimusdb-network:
        ipv4_address: 172.28.1.81
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.optimusdb.service=agent"
      - "com.optimusdb.agent=8"
      - "com.optimusdb.role=follower"

# =============================================================================
