version: '3.8'

# OptimusDB Production Deployment
# Architecture: Heterogeneous Resource Sidecar Pattern
# Total Containers: 16 (8 agents + 8 TinyLlama sidecars)
# Network: Bridge (172.28.0.0/16)

services:
  # =============================================================================
  # COORDINATOR NODE - Agent-1
  # Enhanced resources for heavy metadata generation workload
  # =============================================================================

  tinyllama-agent-1:
    image: optimusdb/tinyllama:latest
    build:
      context: .
      dockerfile: Dockerfile.tinyllama
    container_name: tinyllama-agent-1
    hostname: tinyllama-agent-1
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    environment:
      - MODEL_PATH=/models/tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf
      - LLAMA_HOST=0.0.0.0
      - LLAMA_PORT=8080
      - LLAMA_CTX_SIZE=4096
      - LLAMA_N_GPU_LAYERS=0
      - LLAMA_THREADS=4
      - LLAMA_N_PARALLEL=2
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      optimusdb-network:
        ipv4_address: 172.28.1.10
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.optimusdb.service=tinyllama"
      - "com.optimusdb.agent=1"
      - "com.optimusdb.role=coordinator"

  optimusdb-agent-1:
    image: optimusdb/agent:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: optimusdb-agent-1
    hostname: optimusdb-agent-1
    restart: unless-stopped
    depends_on:
      tinyllama-agent-1:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    ports:
      - "9091:9091"  # REST API
      - "8081:8081"  # Credentials API
    environment:
      - AGENT_ID=1
      - AGENT_PORT=9091
      - CREDENTIALS_PORT=8081
      - IPFS_API=/ip4/127.0.0.1/tcp/5001
      - ORBITDB_DIRECTORY=/data/orbitdb
      - SQLITE_PATH=/data/optimusdb.db
      - BOOTSTRAP_PEERS=
      - ELECTION_ENABLED=true
      - ELECTION_HEARTBEAT_INTERVAL=5s
      - ELECTION_LEASE_DURATION=15s
      - ELECTION_VOTE_TIMEOUT=10s
      - TINYLLAMA_ENDPOINT=http://tinyllama-agent-1:8080/v1/completions
      - TINYLLAMA_ENABLED=true
      - TINYLLAMA_TIMEOUT=30s
      - TINYLLAMA_MAX_TOKENS=512
      - TINYLLAMA_TEMPERATURE=0.7
      - LOG_LEVEL=info
      - RUST_LOG=info
    volumes:
      - agent1-data:/data
      - agent1-orbitdb:/data/orbitdb
    networks:
      optimusdb-network:
        ipv4_address: 172.28.1.11
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.optimusdb.service=agent"
      - "com.optimusdb.agent=1"
      - "com.optimusdb.role=coordinator"

