[supervisord]
nodaemon=true
logfile=/logs/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:tinyllama]
command=/usr/local/bin/llama-server --model /models/tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf --host 0.0.0.0 --port 8080 --ctx-size 2048 --threads %(ENV_TINYLLAMA_THREADS)s --parallel %(ENV_TINYLLAMA_PARALLEL)s
directory=/app
autostart=true
autorestart=true
startretries=3
stderr_logfile=/logs/tinyllama-stderr.log
stdout_logfile=/logs/tinyllama-stdout.log
priority=1
startsecs=10

[program:optimusdb]
command=/app/optimusdb
directory=/app
autostart=true
autorestart=true
startretries=3
stderr_logfile=/logs/optimusdb-stderr.log
stdout_logfile=/logs/optimusdb-stdout.log
priority=2
startsecs=15
depends_on=tinyllama

[eventlistener:processes]
command=/app/start-combined.sh
events=PROCESS_STATE_FATAL